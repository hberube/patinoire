name: Daily Pool Stats Update

on:
  schedule:
    # 09:00 UTC = 05:00 EDT (04:00 EST in winter)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pool-data
  cancel-in-progress: false

jobs:
  sync-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Update Stats & Leaderboard
        run: python scripts/update_pool.py

      - name: Gazette (highlights, awards, milestones)
        # Extras only: never block the standings update if the NHL API hiccups here
        continue-on-error: true
        run: python scripts/insights.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update pool stats"
          git pull --rebase
          git push
