name: Daily Pool Stats Update

on:
  schedule:
    # The game-night loop (live-scores.yml) normally updates the standings right after the last
    # game; this is the safety net. GitHub's schedule is best-effort (top-of-hour slots are the
    # most often delayed or dropped), so try several times: 06:17-10:17 UTC =
    # 2:17-6:17 AM EDT / 1:17-5:17 AM EST. Extra runs find nothing new and commit nothing.
    - cron: '17 6-10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pool-data
  cancel-in-progress: false

jobs:
  sync-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Update Stats & Leaderboard
        run: python scripts/update_pool.py

      - name: Gazette (highlights, awards, milestones)
        # Extras only: never block the standings update if the NHL API hiccups here
        continue-on-error: true
        run: python scripts/insights.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update pool stats"
          git pull --rebase
          git push
