name: Live Scores (Ce soir)

# GitHub's schedule is best-effort and can skip or delay runs by hours, so instead of one
# short run every 15 minutes, a run that starts on a game night stays up and refreshes
# every 2 minutes until the last game is final (scripts/update_live.py --loop).
# Several start times give it many chances to start; runs that find the loop already
# going wait in line and exit right away once the night is over.
on:
  schedule:
    # 16:00-04:30 UTC, every 30 min (noon-12:30 AM EDT / 11 AM-11:30 PM EST)
    - cron: '7,37 16-23 * * *'
    - cron: '7,37 0-4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-loop
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    outputs:
      night_over: ${{ steps.loop.outputs.night_over }}
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Prepare the live branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach live-out
          cd live-out
          git checkout -q --orphan live-tmp
          git rm -rfq . > /dev/null

      - name: Game-night loop
        id: loop
        run: python scripts/update_live.py --loop --out live-out

  # Once the last game is final, make last night's points permanent right away instead of
  # waiting for the morning job (whose schedule GitHub may delay or skip). Only after
  # midnight UTC, so the morning job's "since yesterday" movement stays on the right day.
  standings:
    needs: live
    if: needs.live.outputs.night_over == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pool-data
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Update Stats & Leaderboard
        run: |
          [ "$(date -u +%H)" -lt 12 ] || { echo "Games ended before midnight UTC; the morning job will do it."; exit 0; }
          python scripts/update_pool.py
          python scripts/insights.py || echo "warning: gazette update failed"

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update pool stats (after last game)"
          git pull --rebase
          git push
