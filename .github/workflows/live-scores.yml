name: Live Scores (Ce soir)

# Hugo's PC runs the game-night loop (scripts/local/pool_job.sh night, from Task Scheduler and
# the overseer). This workflow no longer runs on a timer: two copies publishing the same live
# scores and standings kept colliding. It stays here to start by hand (Actions -> Run workflow)
# if the PC is away for a night: it refreshes every 2 minutes until the last game is final
# (scripts/update_live.py --loop), then rebuilds the standings.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-loop
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    outputs:
      night_over: ${{ steps.loop.outputs.night_over }}
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Prepare the live branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach live-out
          cd live-out
          git checkout -q --orphan live-tmp
          git rm -rfq . > /dev/null

      - name: Game-night loop
        id: loop
        run: python scripts/update_live.py --loop --out live-out

  # Once the last game is final, make last night's points permanent right away instead of
  # waiting for the morning job (whose schedule GitHub may delay or skip). Only after
  # midnight UTC, so the morning job's "since yesterday" movement stays on the right day.
  standings:
    needs: live
    if: needs.live.outputs.night_over == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pool-data
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Update Stats & Leaderboard
        run: |
          [ "$(date -u +%H)" -lt 12 ] || { echo "Games ended before midnight UTC; the morning job will do it."; exit 0; }
          python scripts/update_pool.py
          python scripts/insights.py || echo "warning: gazette update failed"

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update pool stats (after last game)"
          git pull --rebase || { git rebase --abort; echo "The PC published first; keeping its update."; exit 0; }
          git push || echo "The PC published first; keeping its update."
