name: Site Sections

# Started from the admin page ("Sections du site"): hide tabs / turn features off for everyone
on:
  workflow_dispatch:
    inputs:
      hidden_tabs:
        description: 'Tabs to hide, comma-separated (e.g. chart,faq); empty = show all'
        required: false
      features_off:
        description: 'Features to turn off, comma-separated (e.g. radio); empty = all on'
        required: false

permissions:
  contents: write

concurrency:
  group: pool-data
  cancel-in-progress: false

jobs:
  sections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update config.json
        env:
          HIDDEN_TABS: ${{ inputs.hidden_tabs }}
          FEATURES_OFF: ${{ inputs.features_off }}
        run: cd scripts && python set_sections.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/config.json
          git diff --staged --quiet && exit 0
          git commit -m "Site sections (admin)"
          git pull --rebase
          git push
